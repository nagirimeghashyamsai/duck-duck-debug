<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101425" />
  <meta name="description" content="Duck Duck Debug: a playful, beginner-friendly Python debugging game." />
  <title>Duck Duck Debug | A Python Debugging Adventure</title>
  <style>
    :root { color-scheme:dark; --bg:#0e1120; --panel:#181c31; --panel2:#212640; --border:#353954; --text:#faf9ff; --muted:#b1b4ca; --gold:#ffd86e; --pink:#ff8fc3; --mint:#85ecc8; --purple:#9f92ff; --red:#ff8e97; --shadow:0 18px 70px #04061364; }
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:radial-gradient(ellipse 48% 26% at 85% 2%,#322d64 0%,transparent 92%),radial-gradient(ellipse 65% 60% at -18% 95%,#183e42 0%,transparent 72%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text);min-height:100vh}
    button{font:inherit;cursor:pointer;transition:transform .15s,background .15s,border-color .15s} button:disabled{opacity:.42;cursor:not-allowed} button:not(:disabled):active{transform:translateY(2px)} button:focus-visible{outline:3px solid #fff;outline-offset:3px} .wrap{max-width:1240px;margin:0 auto;padding:28px 22px 60px}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:28px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:19px;letter-spacing:-.5px}.brandmark{height:43px;width:43px;border:2px solid #ffffff29;background:#ffe28c;border-radius:15px;display:grid;place-items:center;font-size:25px;box-shadow:0 6px 0 #a37437}.nav-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{background:#ffffff0d;border:1px solid var(--border);border-radius:30px;padding:10px 14px;color:var(--muted);font-size:13px;font-weight:800}.pill b{color:var(--gold)}
    .app-layout{display:grid;grid-template-columns:244px minmax(0,1fr);gap:21px;align-items:start}.sidebar{border:1px solid var(--border);background:#171a2cd9;border-radius:23px;padding:18px;box-shadow:var(--shadow);position:sticky;top:16px}.side-title{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--muted);margin:9px 9px 12px}.side-btn{width:100%;display:flex;align-items:center;gap:13px;color:#cbd0e6;background:transparent;border:1px solid transparent;text-align:left;padding:13px 12px;border-radius:13px;font-weight:800;font-size:14px;margin-bottom:5px}.side-btn:hover,.side-btn.active{background:#39335b;border-color:#685d9a;color:white}.side-emoji{font-size:20px}.side-divider{height:1px;background:var(--border);margin:19px 0}.side-note{font-size:12px;line-height:1.7;color:var(--muted);padding:0 9px}.side-note strong{color:var(--mint)}
    .content{min-width:0}.surface{background:linear-gradient(150deg,#242543,#171b30);border:1px solid var(--border);border-radius:25px;box-shadow:var(--shadow)}.hero{padding:31px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;position:relative;overflow:hidden;background:radial-gradient(circle at 78% 17%,#6054a2 0%,transparent 42%),linear-gradient(115deg,#26264b,#191c34 80%)}.hero::before{content:"";position:absolute;right:17%;bottom:-100px;width:220px;height:220px;background:#d8bb7733;filter:blur(75px);pointer-events:none}.eyebrow{text-transform:uppercase;color:var(--mint);font-size:12px;letter-spacing:2.2px;font-weight:900}.hero h1{font-size:clamp(31px,4.2vw,53px);letter-spacing:-1.6px;line-height:1.1;margin:15px 0}.highlight{color:var(--gold)}.lead{color:#c7cae1;line-height:1.7;max-width:48ch;font-size:15px;margin-bottom:23px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;padding:13px 17px;border-radius:13px;font-weight:900;font-size:14px}.btn-main{background:var(--gold);color:#272039;box-shadow:0 5px 0 #a07e45}.btn-main:hover{background:#ffeaab}.btn-secondary{background:#ffffff12;color:white;border-color:#ffffff36}.btn-secondary:hover{background:#ffffff25}.btn-green{background:var(--mint);color:#143b35}.hero-actions{display:flex;flex-wrap:wrap;gap:11px}.duck-scene{position:relative;min-height:270px;display:flex;justify-content:center;align-items:center}.duck-halo{position:absolute;width:211px;height:211px;border-radius:50%;background:radial-gradient(circle,#fdd78142,#c5c8ff12 62%,transparent 70%);filter:blur(9px)}.duck{position:relative;width:220px;max-width:100%;filter:drop-shadow(0 18px 14px #0a071b88);animation:bob 3.2s ease-in-out infinite}.duck svg{width:100%;height:auto;display:block}.duck-hat{position:absolute;z-index:2;left:49%;top:-18px;transform:translateX(-50%);font-size:52px;filter:drop-shadow(0 4px 3px #0006)}@keyframes bob{50%{transform:translateY(-12px) rotate(2deg)}}.floatbug{position:absolute;font-size:27px;animation:float 3s ease-in-out infinite}.bug1{top:18px;right:20px}.bug2{bottom:21px;left:5px;animation-delay:1s}@keyframes float{50%{transform:translateY(-14px) rotate(-12deg)}}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:17px}.stat{background:#1b2037;border:1px solid var(--border);padding:17px 19px;border-radius:18px}.stat .val{font-size:28px;font-weight:900;letter-spacing:-1px}.stat .label{font-size:12px;color:var(--muted);margin-top:3px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:31px 2px 14px}.section-heading h2{font-size:21px;letter-spacing:-.5px;margin:0}.small{font-size:12px;color:var(--muted)}.level-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.level{min-height:117px;background:#1b2038;border:1px solid #3b3d5b;border-radius:18px;padding:16px;text-align:left;color:var(--text)}.level:hover:not(:disabled){background:#28274b;border-color:var(--purple);transform:translateY(-2px)}.level-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.level-num{font-size:12px;color:var(--mint);font-weight:900}.level-icon{font-size:19px}.level-name{font-size:14px;font-weight:900;line-height:1.35}.level-difficulty{color:var(--muted);font-size:11px;margin-top:7px}.level.complete{border-color:#4c8c7a;background:#1c3033}.level.locked{opacity:.45;cursor:not-allowed}
    .game-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.back{background:none;color:var(--muted);border:none;padding:8px 0;font-weight:800}.back:hover{color:white}.game-title{font-size:clamp(25px,4vw,34px);margin:8px 0 8px;letter-spacing:-.8px}.game-meta{color:var(--muted);font-size:13px}.challenge{padding:26px}.instruction{color:var(--muted);font-size:14px;line-height:1.5}.editor{overflow:hidden;border-radius:17px;border:1px solid #44485f;background:#0d1120;margin:19px 0}.editor-bar{height:44px;background:#22283e;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px;color:#b9bdd5}.lights{display:flex;gap:7px}.lights i{height:10px;width:10px;border-radius:50%;background:#ff8486}.lights i:nth-child(2){background:#ffd979}.lights i:nth-child(3){background:#82eac9}.code-line{display:flex;gap:15px;width:100%;color:#e7e4fb;background:transparent;border:0;border-bottom:1px solid #ffffff0b;border-radius:0;min-height:41px;text-align:left;padding:8px 14px;font-family:Consolas,'SFMono-Regular',monospace;font-size:14px;white-space:pre;align-items:center;overflow-x:auto}.code-line:hover:not(:disabled){background:#33345288}.code-line.selected{background:#664a7575;border-left:3px solid var(--pink)}.code-line.disabled-line{cursor:default;opacity:.9}.ln{color:#868aa2;min-width:24px;text-align:right;user-select:none}.feedback{padding:15px 17px;border-radius:14px;background:#3d2b39;border:1px solid #7e5067;font-size:14px;line-height:1.6;margin-top:12px}.feedback.correct{background:#1c3b37;border-color:#498b76}.feedback b{display:block;margin-bottom:4px}.code-question{margin:24px 0 12px;font-size:18px;font-weight:850}.answers{display:grid;gap:10px;margin:14px 0}.choice{background:#252a44;border:1px solid #505572;border-radius:12px;text-align:left;color:white;padding:13px 15px;font-family:Consolas,monospace;font-size:14px;overflow-wrap:anywhere}.choice:hover:not(:disabled){border-color:var(--purple);background:#3a385d}.help-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}.tiny-hint{color:var(--muted);font-size:12px}.progress-track{height:9px;background:#373b56;border-radius:20px;overflow:hidden;margin:16px 0 2px}.progress-bar{height:100%;background:linear-gradient(90deg,#8de8b0,#f4d77f);border-radius:20px;transition:width .3s}.center{text-align:center}.result-emoji{font-size:70px;margin:5px 0 10px}.result-title{font-size:31px;letter-spacing:-1px;margin:10px 0}.result-p{color:var(--muted);line-height:1.7;max-width:550px;margin:12px auto 22px}.fix-review{background:#0d1120;border:1px solid var(--border);border-radius:12px;padding:16px;max-width:600px;text-align:left;margin:20px auto;color:#e3e8f1;line-height:1.7}.fix-review code{white-space:pre-wrap;font-family:Consolas,monospace;color:var(--mint)}
    .wardrobe-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.outfit{border:1px solid var(--border);border-radius:17px;background:#20263e;text-align:left;color:white;padding:15px;display:flex;gap:14px;align-items:center}.outfit:hover:not(:disabled){border-color:var(--purple)}.outfit.selected-outfit{border-color:var(--mint);background:#213d3b}.outfit-icon{font-size:31px}.outfit b{font-size:14px}.outfit small{display:block;color:var(--muted);margin-top:4px}.info-note{background:#1b2d37;border:1px solid #365968;padding:17px 19px;border-radius:14px;color:#bfd7da;font-size:13px;line-height:1.7;margin:18px 0}.footer{font-size:12px;color:#9ba0b8;text-align:center;margin:35px 0 0}.visually-hidden{position:absolute!important;clip:rect(1px,1px,1px,1px);width:1px;height:1px;overflow:hidden;white-space:nowrap}
    @media(max-width:900px){.app-layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;gap:7px;align-items:center;padding:8px;overflow-x:auto}.side-title,.side-note,.side-divider{display:none}.side-btn{margin:0;white-space:nowrap;width:auto;padding:10px 12px}.hero{grid-template-columns:1fr 190px}.duck-scene{min-height:190px}.duck{width:172px}}
    @media(max-width:640px){.wrap{padding:14px 12px 35px}.brand{font-size:16px}.nav{margin-bottom:17px}.nav-right .pill{padding:7px 10px}.hero{grid-template-columns:1fr;padding:24px}.hero h1{font-size:36px}.duck-scene{min-height:150px}.duck{width:150px}.duck-hat{font-size:40px}.level-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{gap:7px}.stat{padding:12px}.stat .val{font-size:22px}.stat .label{font-size:11px}.challenge{padding:15px}.code-line{font-size:12px}.wardrobe-grid{grid-template-columns:1fr}.game-header{align-items:flex-start}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <div class="brand"><div class="brandmark" aria-hidden="true">🦆</div><span>Duck Duck Debug<span style="color:var(--gold)">.</span></span></div>
      <div class="nav-right"><span class="pill">⭐ <b id="nav-xp">0</b> XP</span><span class="pill">🏆 <b id="nav-completed">0</b>/12 levels</span></div>
    </header>
    <div class="app-layout">
      <aside class="sidebar" aria-label="Game navigation">
        <div class="side-title">THE DUCK'S DESK</div>
        <button class="side-btn active" id="nav-home" type="button"><span class="side-emoji">🏠</span> Home & levels</button>
        <button class="side-btn" id="nav-play" type="button"><span class="side-emoji">🐛</span> Catch bugs</button>
        <button class="side-btn" id="nav-outfits" type="button"><span class="side-emoji">🎩</span> Duck wardrobe</button>
        <div class="side-divider"></div>
        <div class="side-note"><strong>QUACK TIP</strong><br/>You don't have to know Python yet. Each bug comes with a friendly explanation.</div>
      </aside>
      <main class="content" id="app" tabindex="-1" aria-live="polite"></main>
    </div>
    <footer class="footer">Made with 💛 for curious coders · Your progress is saved in this browser.</footer>
  </div>
  <script>
    'use strict';
    // All level data lives here. To add a level later, follow the same structure.
    const levels = [
      {title:'The Missing Colon',tag:'If statements',icon:'🔍',code:['age = 18','if age >= 18','    print("Adult")'],line:2,hint:'In Python, an if statement has a special symbol at the end.',choices:['if age >= 18:','if (age >= 18)','if age => 18:'],correct:0,why:'Python needs a colon (:) at the end of an if statement. The colon starts the indented block.',fixed:'if age >= 18:'},
      {title:'The Unfinished Message',tag:'Strings',icon:'💬',code:['message = "Hello','print(message)'],line:1,hint:'Count the quotation marks around the message.',choices:['message = Hello','message = "Hello"','message = ("Hello)'],correct:1,why:'String text must be surrounded by matching quotation marks. The closing quote was missing.',fixed:'message = "Hello"'},
      {title:'A Tricky Comparison',tag:'Conditions',icon:'⚖️',code:['score = 10','if score = 10:','    print("Perfect!")'],line:2,hint:'Assignment uses =, but comparison uses a different operator.',choices:['if score == 10:','if score := 10:','if score equals 10:'],correct:0,why:'Use == when comparing values. A single = assigns a value to a variable.',fixed:'if score == 10:'},
      {title:'Loop Trouble',tag:'For loops',icon:'🔁',code:['for number in range(3)','    print(number)'],line:1,hint:'Think back to the punctuation used after an if condition.',choices:['for number in range(3);','for number in range(3):','for number in range[3]:'],correct:1,why:'A for loop, just like an if statement, needs a colon at the end of its header.',fixed:'for number in range(3):'},
      {title:'The Name Mix-Up',tag:'Variables',icon:'🏷️',code:['username = "Alex"','print(user_name)'],line:2,hint:'Python cares about exact variable names, including underscores.',choices:['print(username)','print(USERNAME)','print(user-name)'],correct:0,why:'The created variable is named username. user_name is a different, undefined variable.',fixed:'print(username)'},
      {title:'The Banana Basket',tag:'Lists',icon:'🍌',code:['fruits = ["apple"]','fruits.add("banana")','print(fruits)'],line:2,hint:'Lists have a method for adding one item to the end.',choices:['fruits.push("banana")','fruits.append("banana")','fruits.additem("banana")'],correct:1,why:'Python lists use .append() to add one item to the end. .add() is used by sets, not lists.',fixed:'fruits.append("banana")'},
      {title:'Indentation Intruder',tag:'While loops',icon:'📐',code:['count = 0','while count < 3:','print(count)','    count += 1'],line:3,hint:'Lines inside a while loop need to move to the right.',choices:['    print(count)','print (count):','print(count):'],correct:0,why:'All statements inside a while loop need indentation. Without it, Python raises an IndentationError.',fixed:'    print(count)'},
      {title:'The Sleepy Function',tag:'String methods',icon:'😴',code:['name = "duck"','print(name.upper)'],line:2,hint:'To call a method, put something after its name.',choices:['print(upper.name)','print(name.upper())','print(name.upper[])'],correct:1,why:'A method needs parentheses to run. Without them, Python refers to the method instead of calling it.',fixed:'print(name.upper())'},
      {title:'The Invisible Fourth Item',tag:'List indexing',icon:'📦',code:['items = ["pen", "book", "bag"]','print(items[3])'],line:2,hint:'Python lists start counting from zero, not one.',choices:['print(items[2])','print(items[4])','print(items(3))'],correct:0,why:'A three-item list uses indexes 0, 1 and 2. Index 3 is outside the list.',fixed:'print(items[2])'},
      {title:'Professor Function',tag:'Functions',icon:'🧑‍🏫',code:['def greet(name)','    print("Hello", name)','greet("Duck")'],line:1,hint:'Function definitions end with the same symbol as if and for.',choices:['def greet(name):','define greet(name):','def greet(name);'],correct:0,why:'A function definition using def must end with a colon before its indented body.',fixed:'def greet(name):'},
      {title:'String Versus Number',tag:'Data types',icon:'🔢',code:['points = "10"','print(points + 5)'],line:2,hint:'A quoted number is still text. Convert it before addition.',choices:['print(points + "5")','print(int(points) + 5)','print(str(points) + 5)'],correct:1,why:'int(points) converts numeric text into an integer, so it can be added to 5.',fixed:'print(int(points) + 5)'},
      {title:'The Last Boss Bug',tag:'Built-in functions',icon:'👑',code:['treasures = ["coin", "gem"]','print(treasures.length)'],line:2,hint:'Python uses a built-in function to count list items.',choices:['print(treasures.size())','print(count(treasures))','print(len(treasures))'],correct:2,why:'Use len(list_name) to find how many elements a Python list contains.',fixed:'print(len(treasures))'}
    ];
    const costumes = [
      {id:'classic',name:'Classic Duck',emoji:'🦆',cost:0,hat:''},
      {id:'detective',name:'Detective Duck',emoji:'🕵️',cost:60,hat:'🕵️'},
      {id:'wizard',name:'Wizard Duck',emoji:'🧙',cost:140,hat:'🧙'},
      {id:'royal',name:'Royal Duck',emoji:'👑',cost:220,hat:'👑'}
    ];
    const storageKey = 'duck-duck-debug-v1';
    function loadProgress(){try{const data=JSON.parse(localStorage.getItem(storageKey)||'{}');return {completed:Array.isArray(data.completed)?data.completed.filter(n=>Number.isInteger(n)&&n>=0&&n<levels.length):[],outfit:typeof data.outfit==='string'?data.outfit:'classic'};}catch{return {completed:[],outfit:'classic'};}}
    let progress=loadProgress();
    let screen='home',current=0,phase='find',mistakes=0,hintUsed=false,feedback='';
    const app=document.getElementById('app');
    const completedSet=()=>new Set(progress.completed);
    const xp=()=>completedSet().size*20;
    const nextUnlocked=()=>{let i=0;const done=completedSet();while(i<levels.length&&done.has(i))i++;return Math.min(i,levels.length-1);};
    function save(){try{localStorage.setItem(storageKey,JSON.stringify(progress));}catch{}}
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
    function duckSvg(){return `<svg viewBox="0 0 260 260" role="img" aria-label="Friendly yellow rubber duck mascot"><ellipse cx="130" cy="231" rx="76" ry="13" fill="#15122d" opacity=".25"/><path d="M58 151c-11-30-1-60 25-78 13-9 29-13 46-13 41 0 70 27 70 66 0 14-3 24-9 35 19 10 30 21 30 35 0 24-35 39-88 39-56 0-91-22-93-51-2-15 5-25 19-33Z" fill="#ffd65e" stroke="#e9a844" stroke-width="5"/><path d="M72 157c12 5 22 11 36 15-3 16-14 26-30 29-11-9-18-22-20-35Z" fill="#f6bc4a" opacity=".7"/><path d="M171 139c14 7 26 14 35 24-11 6-21 6-35 0Z" fill="#ffad5d" stroke="#db854b" stroke-width="3"/><circle cx="148" cy="104" r="7" fill="#27213d"/><circle cx="150" cy="102" r="2" fill="white"/><path d="M179 116c9-2 18 0 23 7-7 10-22 14-32 7Z" fill="#ff9b61" stroke="#d77b49" stroke-width="3"/><path d="M117 123c4 5 10 5 14 0" stroke="#df9e3e" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="115" cy="134" r="9" fill="#ffc76e" opacity=".65"/></svg>`;}
    function duckMarkup(){const c=costumes.find(x=>x.id===progress.outfit)||costumes[0];return `<div class="duck-scene"><span class="duck-halo"></span><span class="floatbug bug1" aria-hidden="true">🐛</span><span class="floatbug bug2" aria-hidden="true">✨</span><div class="duck">${c.hat?`<span class="duck-hat" aria-hidden="true">${c.hat}</span>`:''}${duckSvg()}</div></div>`;}
    function refreshNav(){document.getElementById('nav-xp').textContent=xp();document.getElementById('nav-completed').textContent=completedSet().size;['home','play','outfits'].forEach(n=>document.getElementById('nav-'+n).classList.toggle('active',(screen==='game'&&n==='play')||(screen===n)));}
    function render(){refreshNav();if(screen==='home')renderHome();else if(screen==='outfits')renderOutfits();else renderGame();}
    function renderHome(){const done=completedSet();const next=nextUnlocked();app.innerHTML=`<section class="surface hero"><div><div class="eyebrow">🐛 The bugs are loose!</div><h1>Quack the code.<br/><span class="highlight">Catch the bugs.</span></h1><p class="lead">A tiny Python coding adventure starring one extremely determined rubber duck. Spot mistakes, learn to fix them, and unlock ridiculous hats!</p><div class="hero-actions"><button class="btn btn-main" type="button" id="start-game">${done.size?'Continue adventure →':'Start debugging →'}</button><button class="btn btn-secondary" type="button" id="visit-outfits">🎩 Duck wardrobe</button></div></div>${duckMarkup()}</section>
      <div class="stats"><div class="stat"><div class="val">${xp()} ⭐</div><div class="label">XP earned</div></div><div class="stat"><div class="val">${done.size}/${levels.length}</div><div class="label">Bugs caught</div></div><div class="stat"><div class="val">${Math.floor(done.size/3)}/4</div><div class="label">Worlds explored</div></div></div>
      <div class="section-heading"><h2>🗺️ Your debugging journey</h2><span class="small">12 bite-size levels</span></div><div class="level-grid">${levels.map((lv,i)=>{const locked=i>next&&!done.has(i);return `<button class="level ${done.has(i)?'complete':''} ${locked?'locked':''}" data-level="${i}" type="button" ${locked?'disabled':''}><div class="level-top"><span class="level-num">LEVEL ${String(i+1).padStart(2,'0')}</span><span class="level-icon">${done.has(i)?'✅':locked?'🔒':lv.icon}</span></div><div class="level-name">${escapeHtml(lv.title)}</div><div class="level-difficulty">${escapeHtml(lv.tag)}</div></button>`;}).join('')}</div>`;
      document.getElementById('start-game').onclick=()=>startLevel(next);document.getElementById('visit-outfits').onclick=()=>{screen='outfits';render();};
      app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>startLevel(Number(b.dataset.level)));
    }
    function startLevel(index){if(index<0||index>=levels.length)return;const done=completedSet();if(index>nextUnlocked()&&!done.has(index))return;current=index;phase='find';mistakes=0;hintUsed=false;feedback='';screen='game';render();window.scrollTo({top:0,behavior:'smooth'});}
    function renderGame(){const lv=levels[current];let content='';if(phase==='success'){
        content=`<div class="center"><div class="result-emoji" aria-hidden="true">🎉🦆</div><div class="eyebrow">BUG CAPTURED!</div><h2 class="result-title">Quacktastic debugging!</h2><p class="result-p">${escapeHtml(lv.why)}</p><div class="fix-review"><div class="small">THE CORRECT CODE</div><code>${escapeHtml(lv.fixed)}</code></div><div class="hero-actions" style="justify-content:center"><button class="btn btn-main" id="next-level" type="button">${current===levels.length-1?'Back to map':'Next level →'}</button><button class="btn btn-secondary" id="return-map" type="button">Level map</button></div></div>`;
      }else{
        const lines=lv.code.map((line,i)=>`<button class="code-line ${phase==='fix'?'disabled-line':''}" ${phase==='fix'?'disabled':''} data-line="${i+1}" type="button" aria-label="Select code line ${i+1}: ${escapeHtml(line)}"><span class="ln">${i+1}</span><span>${escapeHtml(line)||' '}</span></button>`).join('');
        const solutions=lv.choices.map((choice,i)=>`<button class="choice" data-choice="${i}" type="button">${String.fromCharCode(65+i)}. ${escapeHtml(choice)}</button>`).join('');
        content=`<div class="eyebrow">MISSION ${current+1} OF ${levels.length} · ${escapeHtml(lv.tag)}</div><h2 class="game-title">${escapeHtml(lv.title)}</h2><p class="instruction">${phase==='find'?'Our programmer needs help! Click the line of Python code that contains a bug.':'Brilliant spot! Now choose the correct way to fix that line.'}</p><div class="editor"><div class="editor-bar"><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span><span>mystery.py</span><span>Python 🐍</span></div>${lines}</div><h3 class="code-question">${phase==='find'?'🔍 Which line has the bug?':'🔧 What is the correct fix?'}</h3>${phase==='fix'?`<div class="answers">${solutions}</div>`:''}<div id="feedback-area" aria-live="polite">${feedback?`<div class="feedback">${escapeHtml(feedback)}</div>`:''}</div><div class="help-row"><button class="btn btn-secondary" id="hint-btn" type="button">💡 ${hintUsed?'Show hint again':'Need a hint?'}</button><span class="tiny-hint">No rush. Real developers make mistakes too!</span></div>`;
      }
      app.innerHTML=`<div class="game-header"><button class="back" type="button" id="back-to-map">← Back to level map</button><span class="pill">${completedSet().has(current)?'✅ Completed':'⭐ 20 XP to earn'}</span></div><div class="surface challenge">${content}</div><div class="progress-track"><div class="progress-bar" style="width:${(completedSet().size/levels.length*100).toFixed(2)}%"></div></div><p class="small">Total game progress: ${completedSet().size} of ${levels.length} levels completed</p>`;
      document.getElementById('back-to-map').onclick=()=>{screen='home';render();};
      if(phase==='success'){document.getElementById('return-map').onclick=()=>{screen='home';render();};document.getElementById('next-level').onclick=()=>current+1<levels.length?startLevel(current+1):(screen='home',render());}
      else{app.querySelectorAll('[data-line]').forEach(b=>b.onclick=()=>chooseLine(Number(b.dataset.line)));app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>chooseFix(Number(b.dataset.choice)));document.getElementById('hint-btn').onclick=()=>{hintUsed=true;feedback='💡 Duck hint: '+lv.hint;updateFeedback();};}
    }
    function updateFeedback(){const area=document.getElementById('feedback-area');if(area)area.innerHTML=`<div class="feedback" role="status">${escapeHtml(feedback)}</div>`;}
    function chooseLine(line){if(phase!=='find')return;if(line===levels[current].line){phase='fix';feedback='';render();}else{mistakes++;feedback=mistakes>=2?'Not quite. '+levels[current].hint:'Not that line. Look again!';updateFeedback();}}
    function chooseFix(index){if(phase!=='fix')return;const lv=levels[current];if(index===lv.correct){if(!completedSet().has(current)){progress.completed.push(current);save();}phase='success';render();}else{mistakes++;feedback='That fix isn\'t quite right. '+(mistakes>=2?lv.hint:'Try another option.');updateFeedback();}}
    function renderOutfits(){app.innerHTML=`<section class="surface hero"><div><div class="eyebrow">🎩 THE QUACK COUTURE SHOP</div><h1>Duck <span class="highlight">wardrobe.</span></h1><p class="lead">Your duck deserves a fashionable career. Earn XP by solving Python bugs to unlock these completely free costumes.</p><button class="btn btn-secondary" id="shop-home" type="button">← Back to level map</button></div>${duckMarkup()}</section><div class="section-heading"><h2>Choose your look</h2><span class="small">Your XP: ${xp()} ⭐</span></div><div class="wardrobe-grid">${costumes.map(c=>{const unlocked=xp()>=c.cost;const equipped=c.id===progress.outfit;return `<button class="outfit ${equipped?'selected-outfit':''}" data-outfit="${c.id}" type="button" ${unlocked?'':'disabled'}><span class="outfit-icon">${c.emoji}</span><span><b>${escapeHtml(c.name)}</b><small>${equipped?'✓ Currently equipped':unlocked?'Tap to equip':'🔒 Unlock at '+c.cost+' XP'}</small></span></button>`;}).join('')}</div><div class="info-note">🦆 Costumes are cosmetic rewards. They don't affect scoring or cost real money. Your unlocks and progress stay saved in this browser.</div><button class="btn btn-secondary" id="reset-btn" type="button">Reset my game progress</button>`;
      document.getElementById('shop-home').onclick=()=>{screen='home';render();};app.querySelectorAll('[data-outfit]').forEach(b=>b.onclick=()=>{const chosen=costumes.find(c=>c.id===b.dataset.outfit);if(chosen&&xp()>=chosen.cost){progress.outfit=chosen.id;save();render();}});
      document.getElementById('reset-btn').onclick=()=>{if(window.confirm('Reset all completed levels, XP, and costumes? This cannot be undone.')){progress={completed:[],outfit:'classic'};save();screen='home';render();}};
    }
    document.getElementById('nav-home').onclick=()=>{screen='home';render();};document.getElementById('nav-play').onclick=()=>startLevel(nextUnlocked());document.getElementById('nav-outfits').onclick=()=>{screen='outfits';render();};
    render();
  </script>
</body>
</html>
